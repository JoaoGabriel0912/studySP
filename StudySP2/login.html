<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudySP | Provão Paulista+TCC</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const tema = localStorage.getItem('tema');
            if (tema !== 'light') {
                document.documentElement.classList.add('dark-theme');
            }
        })();
    </script>
</head>
<body>
    <!-- Botão de Alternar Tema (Claro / Escuro) -->
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="alternarTema()" title="Alternar entre tema claro e escuro">
        <span id="themeToggleIcon" class="theme-toggle-icon">☀️</span>
        <span id="themeToggleText">Modo Claro</span>
    </button>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Coluna Visual / Banner -->
            <div class="login-banner">
                <div class="banner-content">
                    <img src="./img/login-logo.png" alt="StudySP Logo" class="banner-logo">
                    <div class="banner-text">
                        <h3>Prepare-se para a sua Conquista</h3>
                        <p>Simulados, Método Pomodoro e Mentoria de TCC com IA</p>
                    </div>
                </div>
            </div>

            <!-- Coluna do Formulário -->
            <div class="login-form-section">
                <div class="form-header">
                    <h2>Plataforma de Estudos</h2>
                    <p class="subtitle">Provão Paulista + TCC</p>
                </div>
                
                <form id="formLogin">
                    <div class="input-group">
                        <label for="rmLogin">RM</label>
                        <input type="text" id="rmLogin" placeholder="Digite seu RM" required autocomplete="username">
                    </div>
                    <div class="input-group">
                        <label for="senhaLogin">Senha</label>
                        <input type="password" id="senhaLogin" placeholder="Digite sua senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn">Entrar</button>
                </form>
                
                <div class="footer-links">
                    <a href="cadastro.html" class="link-escola">Acesso Restrito: Cadastro da Escola</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Flutuante de Login Bem-Sucedido -->
    <div id="modal-login-sucesso" class="modal-overlay hidden">
        <div class="modal-content modal-login-card">
            <div class="login-sucesso-icon">🎓</div>
            <h3 class="login-sucesso-title">Login Bem-Sucedido!</h3>
            <p class="login-sucesso-mensagem" id="loginSucessoMensagem">Seja bem-vindo(a), Aluno: <strong>Nome</strong></p>
            <div class="login-loading-bar">
                <div class="login-loading-progress" id="loginProgressBar"></div>
            </div>
            <p class="login-loading-text">Carregando seus simulados e metas...</p>
            <button type="button" class="btn btn-login-avancar" onclick="redirecionarAlunoAgora()">Entrar no Painel ➔</button>
        </div>
    </div>

    <!-- Toast / Alerta Flutuante para Erros de Login -->
    <div id="loginToastErro" class="login-toast-erro hidden">
        <span class="erro-icon">⚠️</span>
        <span id="loginToastTexto">RM ou Senha incorretos.</span>
    </div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
